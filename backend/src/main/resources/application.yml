micronaut:
  server:
    host-resolution:
      host-header: X-Forwarded-Host
      protocol-header: X-Forwarded-Proto
      port-header: X-Forwarded-Port
    cors:
      enabled: true
      configurations:
        all:
          allowed-origins:
            - "${FRONTEND_URL:http://localhost:5173}"
          allowed-methods:
            - "*"
          allowed-headers:
            - "*"
          exposed-headers:
            - "*"
  application:
    name: backend
  security:
    authentication: bearer
    redirect:
      login-success: "${FRONTEND_URL:http://localhost:5173}/auth/callback"
      login-failure: "${FRONTEND_URL:http://localhost:5173}/login?error=true"
    oauth2:
      clients:
        google:
          client-id: "${GOOGLE_CLIENT_ID}"
          client-secret: "${GOOGLE_CLIENT_SECRET}"
          openid:
            issuer: 'https://accounts.google.com'
            authorization:
              prompt: SELECT_ACCOUNT
    endpoints:
      oauth2:
        login:
          enabled: true
        callback:
          enabled: true
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: "${JWT_SECRET}"
            validation:
              secret: "${JWT_SECRET}"
    intercept-url-map:
      - pattern: /**
        http-method: OPTIONS
        access:
          - isAnonymous()
      - pattern: /oauth/**
        access:
          - isAnonymous()
      - pattern: /api/auth/**
        access:
          - isAnonymous()
      - pattern: /swagger/**
        access:
          - isAnonymous()
      - pattern: /swagger-ui/**
        access:
          - isAnonymous()
      - pattern: /
        access:
          - isAnonymous()
      - pattern: /health
        access:
          - isAnonymous()
      - pattern: /**
        access:
          - isAuthenticated()
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**

datasources:
  default:
    url: "${DB_URL:jdbc:postgresql://localhost:5433/keeper}"
    driverClassName: org.postgresql.Driver
    username: "${DB_USER:postgres}"
    password: "${DB_PASSWORD:password}"
    dialect: POSTGRES
    schema-generate: NONE

flyway:
  datasources:
    default:
      enabled: true

jpa:
  default:
    packages-to-scan:
      - 'com.keeper'
    properties:
      hibernate:
        hbm2ddl:
          auto: none
        show_sql: false
