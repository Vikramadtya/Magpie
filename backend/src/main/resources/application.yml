micronaut:
  serde:
    serialization:
      inclusion: ALWAYS
  server:
    max-request-size: 6MB
    multipart:
      max-file-size: 5MB
    host-resolution:
      host-header: X-Forwarded-Host
      protocol-header: X-Forwarded-Proto
      port-header: X-Forwarded-Port
    cors:
      enabled: true
      configurations:
        all:
          allowed-origins:
            - "${FRONTEND_URL:http://localhost:5173}"
          allowed-methods: [GET, POST, PATCH, PUT, DELETE]
          allowed-headers: [Authorization, Content-Type, Idempotency-Key]
          allow-credentials: true
  application:
    name: backend
  security:
    authentication: bearer
    redirect:
      login-success: "${FRONTEND_URL:http://localhost:5173}/auth/callback"
      login-failure: "${FRONTEND_URL:http://localhost:5173}/login?error=true"
    oauth2:
      clients:
        google:
          client-id: "${GOOGLE_CLIENT_ID}"
          client-secret: "${GOOGLE_CLIENT_SECRET}"
          openid:
            issuer: 'https://accounts.google.com'
            authorization:
              prompt: SELECT_ACCOUNT
    endpoints:
      oauth2:
        login:
          enabled: true
        callback:
          enabled: true
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: "${JWT_SECRET}"
            validation:
              secret: "${JWT_SECRET}"
    intercept-url-map:
      - pattern: /**
        http-method: OPTIONS
        access:
          - isAnonymous()
      - pattern: /oauth/**
        access:
          - isAnonymous()
      - pattern: /api/v1/auth/**
        access:
          - isAnonymous()
      - pattern: /swagger/**
        access:
          - isAnonymous()
      - pattern: /swagger-ui/**
        access:
          - isAnonymous()
      - pattern: /
        access:
          - isAnonymous()
      - pattern: /health
        access:
          - isAnonymous()
      - pattern: /**
        access:
          - isAuthenticated()
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**

datasources:
  default:
    url: "${DB_URL:jdbc:postgresql://localhost:5433/keeper}"
    driverClassName: org.postgresql.Driver
    username: "${DB_USER:postgres}"
    password: "${DB_PASSWORD:password}"
    dialect: POSTGRES
    schema-generate: NONE
    maximum-pool-size: "${DB_POOL_SIZE:10}"
    minimum-idle: 2

flyway:
  datasources:
    default:
      enabled: true

keeper:
  cookie:
    secure: "${COOKIE_SECURE:true}"

# Our HealthController serves /health; the built-in management endpoint would shadow it.
endpoints:
  all:
    enabled: false
