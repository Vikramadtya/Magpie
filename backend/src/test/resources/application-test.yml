datasources:
  default:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE DOMAIN IF NOT EXISTS ltree AS VARCHAR
    driverClassName: org.h2.Driver
    username: sa
    password: ""
    dialect: POSTGRES

flyway:
  datasources:
    default:
      enabled: false

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: update
        show_sql: false

micronaut:
  security:
    enabled: false
