<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Keeper" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#007AFF" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keeper</title>
    <style>
      body { margin: 0; background: #f2f2f7; }
      @media (prefers-color-scheme: dark) { body { background: #000; } }
      .boot { min-height: 100vh; display: grid; place-items: center; }
      .boot svg { overflow: visible; }
      .boot .coin { animation: cd 1.65s ease-in infinite; }
      .boot .jar { transform-origin: 60px 106px; animation: jb 1.65s ease-out infinite; }
      @keyframes cd { 0% { transform: translateY(0); opacity: 0 } 12% { opacity: 1 } 62% { transform: translateY(78px); opacity: 1 } 80%, 100% { transform: translateY(78px); opacity: 0 } }
      @keyframes jb { 0%, 55% { transform: scale(1) } 62% { transform: scale(1.04, .97) } 72%, 100% { transform: scale(1) } }
      @media (prefers-reduced-motion: reduce) { .boot .coin, .boot .jar { animation: none } }
    </style>
  </head>
  <body>
        <div id="root"><div class="boot" role="status" aria-label="Loading"><svg width="96" height="96" viewBox="0 0 120 120" aria-hidden="true"><defs><clipPath id="bc"><rect x="30" y="46" width="60" height="60" rx="14"/></clipPath></defs><g class="jar"><g clip-path="url(#bc)"><rect x="30" y="46" width="60" height="60" fill="#007aff" fill-opacity=".1"/><rect x="30" y="70" width="60" height="40" fill="#007aff" fill-opacity=".28"/><g class="coin"><circle cx="50" cy="8" r="9" fill="#ffcc00" stroke="#e0a800" stroke-width="2"/></g><g class="coin" style="animation-delay:.55s"><circle cx="60" cy="8" r="9" fill="#ffcc00" stroke="#e0a800" stroke-width="2"/></g><g class="coin" style="animation-delay:1.1s"><circle cx="70" cy="8" r="9" fill="#ffcc00" stroke="#e0a800" stroke-width="2"/></g></g><rect x="30" y="46" width="60" height="60" rx="14" fill="none" stroke="#007aff" stroke-width="4"/><rect x="24" y="38" width="72" height="10" rx="5" fill="#007aff"/></g></svg></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
